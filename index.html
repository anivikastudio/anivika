<!DOCTYPE html>

<html lang="en">

<head>

    <!-- BASIC -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <!-- SEO -->

    <title>
        Anivika | Home of Original Worlds
    </title>

    <meta
        name="description"
        content="Anivika creates original worlds, characters, and stories through Anivika Originals. Explore new universes, memorable characters, and imaginative storytelling.">

    <meta
        name="author"
        content="Anivika">

    <!-- OPEN GRAPH -->

    <meta
        property="og:type"
        content="website">

    <meta
        property="og:title"
        content="Anivika | Home of Original Worlds">

    <meta
        property="og:description"
        content="Explore original worlds, characters, and stories created by Anivika.">

    <meta
        property="og:image"
        content="https://anivika.com/assets/seo/og-home.jpg">

    <meta
        property="og:url"
        content="https://anivika.com">

    <meta
        property="og:site_name"
        content="Anivika">

    <!-- TWITTER / X -->

    <meta
        name="twitter:card"
        content="summary_large_image">

    <meta
        name="twitter:title"
        content="Anivika | Home of Original Worlds">

    <meta
        name="twitter:description"
        content="Explore original worlds, characters, and stories created by Anivika.">

    <meta
        name="twitter:image"
        content="https://anivika.com/assets/seo/og-home.jpg">

    <!-- CANONICAL -->

    <link
        rel="canonical"
        href="https://anivika.com">

    <!-- FAVICON -->

    <link
        rel="icon"
        type="image/svg+xml"
        href="assets/favicon/favicon.svg">

    <link
        rel="icon"
        type="image/x-icon"
        href="assets/favicon/favicon.ico">

    <link
        rel="apple-touch-icon"
        href="assets/favicon/apple-touch-icon.png">

    <!-- WEB APP -->

    <link
        rel="manifest"
        href="site.webmanifest">

    <!-- SCHEMA : ORGANIZATION -->

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Anivika",
      "url": "https://anivika.com",
      "logo": "https://anivika.com/assets/logo/anivika-logo-white.svg",
      "description": "Independent studio creating original worlds, characters, and stories.",
      "foundingDate": "2021",
      "sameAs": [
        "https://www.instagram.com/anivika.id"
      ]
    }
    </script>

    <!-- SCHEMA : WEBSITE -->

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Anivika",
      "url": "https://anivika.com",
      "description": "Official website of Anivika."
    }
    </script>

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/global.css">

    <link
        rel="stylesheet"
        href="css/layout/navbar.css">

    <link
        rel="stylesheet"
        href="css/layout/footer.css">

    <link
        rel="stylesheet"
        href="css/layout/buttons.css">

    <link
        rel="stylesheet"
        href="css/layout/card.css">

    <link
        rel="stylesheet"
        href="css/layout/popup.css">

    <link
        rel="stylesheet"
        href="css/pages/index.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>


<!-- ======================================
     LOADER
======================================= -->

<div id="loader">

    <h2>
        ANIVIKA
    </h2>

</div>

<!-- ======================================
     NAVBAR
======================================= -->

<header class="navbar">

    <a
        href="index.html"
        class="logo">

        <img
            src="assets/logo/anivika-logo-white.svg"
            alt="Anivika">

    </a>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="originals.html">
            Originals
        </a>

    </nav>

    <button id="searchButton">

        Search

    </button>

</header>

<!-- ======================================
     MAIN
======================================= -->

<main>

    <!-- HERO -->

    <section class="hero">

        <video
            id="hero-video"
            class="hero-video"
            autoplay
            muted
            loop
            playsinline>

            <source
                id="hero-video-source"
                src=""
                type="video/mp4">

        </video>

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <span
                id="hero-label"
                class="hero-label">

            </span>

            <h1
                id="hero-title">

            </h1>

            <p
                id="hero-description">

            </p>

            <div class="hero-actions">

                <a
                    id="hero-button"
                    href="#"
                    class="btn-primary">

                    Explore World

                </a>

                <button
                    id="heroMoreInfo"
                    class="btn-secondary">

                    More Info

                </button>

            </div>

        </div>

    </section>

    <!-- FEATURED -->

    <section class="content-row">

        <div class="section-header">

            <h2>
                Featured Originals
            </h2>

        </div>

        <div
            id="featured-originals"
            class="cards-container">

        </div>

    </section>

    <!-- COMING SOON -->

    <section class="content-row">

        <div class="section-header">

            <h2>
                Coming Soon
            </h2>

        </div>

        <div
            id="coming-soon"
            class="cards-container">

        </div>

    </section>

    <!-- WORLDS -->

    <section class="content-row">

        <div class="section-header">

            <h2>
                Worlds
            </h2>

        </div>

        <div
            id="worlds"
            class="cards-container">

        </div>

    </section>

</main>

</main>

<!-- ======================================
     FOOTER
======================================= -->

<div id="footer-container"></div>

<!-- ======================================
     POPUP
======================================= -->

<div
    id="popupOverlay"
    class="popup-overlay">

    <div class="popup-box">

        <button
            id="popupClose"
            class="popup-close">

            ×

        </button>

        <!-- POSTER -->

        <div class="popup-poster">

            <img
                id="popupPoster"
                src=""
                alt="">

        </div>

        <!-- CONTENT -->

        <div class="popup-content">

            <span
                id="popupSubtitle"
                class="popup-subtitle">

            </span>

            <h2
                id="popupTitle">

            </h2>

            <!-- META -->

            <div class="popup-meta">

                <span
                    id="popupStatus">

                </span>

                <span
                    id="popupFormat">

                </span>

                <span
                    id="popupGenre">

                </span>

            </div>

            <p
                id="popupDescription">

            </p>

            <!-- ACTIONS -->

            <div class="popup-actions">

                <a
                    id="popupYoutube"
                    href="#"
                    target="_blank"
                    class="btn-primary">

                    Watch on YouTube

                </a>

                <a
                    id="popupExplore"
                    href="#"
                    class="btn-secondary">

                    Explore World

                </a>

            </div>

        </div>

    </div>

</div>
<!-- ======================================
     JAVASCRIPT
======================================= -->
<script src="../../js/core/data-loader.js"></script>
<script src="js/core/navbar.js"></script>

<script src="js/core/loader.js"></script>

<script src="js/core/popup.js"></script>

<script src="js/core/footer.js"></script>

<script src="js/pages/index.js"></script>

</body>

</html>
